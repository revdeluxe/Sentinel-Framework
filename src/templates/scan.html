{% extends 'base.html' %}

{% block title %}Biometric Scan | Sentinel{% endblock %}
{% block header_title %}Identity Verification{% endblock %}

{% block content %}
<style>
    /* Scanner HUD Overlay - FaceID Style */
    .scanner-container {
        position: relative;
        width: min(100%, 420px);
        margin: 0 auto;
        overflow: hidden;
        border-radius: 20px; /* More rounded like mobile */
        box-shadow: 0 0 30px rgba(0,0,0,0.8);
        background: linear-gradient(180deg, rgba(18,18,18,0.92), rgba(9,9,9,0.98));
    }

    .scanner-container.is-busy .scan-line {
        opacity: 0.4;
    }
    
    .scanner-overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: 10;
        border: 2px solid rgba(0, 255, 0, 0.0); /* Hidden by default */
        transition: border-color 0.3s ease;
    }

    /* Scanning Animation */
    .scan-line {
        position: absolute;
        width: 100%;
        height: 4px;
        background: #00ff00;
        box-shadow: 0 0 15px #00ff00;
        animation: scanMove 1.5s infinite alternate;
        opacity: 0.8;
    }

    @keyframes scanMove {
        0% { top: 5%; }
        100% { top: 95%; }
    }
    
    /* Status Text Overlay */
    .status-overlay {
        position: absolute;
        bottom: 20px;
        left: 0; right: 0;
        text-align: center;
        color: white;
        z-index: 12;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        font-weight: bold;
        font-size: 1.1rem;
    }
    
    .status-icon { font-size: 2rem; display: block; margin-bottom: 5px; }

    .scan-loader {
        display: inline-block;
        width: 18px;
        height: 18px;
        border: 3px solid rgba(255,255,255,0.35);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        vertical-align: middle;
        margin-right: 10px;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card card-dark border-0 shadow-lg">
            <div class="card-header text-center">
                <h5 class="mb-0">Look at the camera</h5>
            </div>
            <div class="card-body bg-black p-4 text-center" style="background-color: #121212;">
                
                <div class="scanner-container" id="scanner-container" data-api-endpoint="/api/biometric-auth" data-poll-interval="{{ face_capture_interval }}" data-capture-size="160">
                    <div class="scanner-overlay" id="scan-border">
                        <div class="scan-line" id="scan-line"></div>
                    </div>
                    
                    <div class="status-overlay" id="status-text">
                        <i class="fas fa-search status-icon text-secondary"></i>
                        Initializing...
                    </div>

                    <video id="video" width="320" height="240" autoplay muted playsinline style="width: 100%; display: block; transform: scaleX(-1);"></video>
                    
                    <canvas id="canvas" width="160" height="160" style="display:none;"></canvas>
                </div>

                <div class="mt-3 text-muted small">
                    <i class="fas fa-shield-alt mr-1"></i> Biometric Engine Active
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/biometric_scan.js" defer></script>
{% endblock %}
